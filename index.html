<title>Recettes de famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,600&family=Permanent+Marker&family=Rammetto+One&display=swap">
<style>
/* Layout : filtres à gauche + grille de cartes ; fiche = photo | titre, puis ingrédients | préparation */
:root{
  --bg:#FFFFFF; --panel:#F4F2EF; --line:#E4DFD8;
  --ink:#4A4541; --ink-soft:#6F6862; --title:#55504B;
  --accent:#D4651B; --accent-strong:#B8530F; --on-accent:#FFFFFF;
  --ph-a:#F6D9BF; --ph-b:#EDB98D; --ph-ink:#9A4A12;
  --sea:#DCE8EC; --land:#CBBDA7; --land-hi:#EFA565; --map-line:#978A79;
  --display:"Rammetto One","Cooper Black","Rockwell Extra Bold",Georgia,serif;
  --body:"Open Sans","Helvetica Neue",Arial,sans-serif;
  --hand:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1A17; --panel:#292521; --line:#3B3530;
    --ink:#E6DFD7; --ink-soft:#B3AAA0; --title:#F1EAE2;
    --accent:#EC8236; --accent-strong:#F49A57; --on-accent:#22140A;
    --ph-a:#4A3222; --ph-b:#6B4326; --ph-ink:#F3C59D;
    --sea:#1F2D35; --land:#5C5044; --land-hi:#C56A22; --map-line:#8F8171;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1A17; --panel:#292521; --line:#3B3530;
  --ink:#E6DFD7; --ink-soft:#B3AAA0; --title:#F1EAE2;
  --accent:#EC8236; --accent-strong:#F49A57; --on-accent:#22140A;
  --ph-a:#4A3222; --ph-b:#6B4326; --ph-ink:#F3C59D;
    --sea:#1F2D35; --land:#5C5044; --land-hi:#C56A22; --map-line:#8F8171;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0;padding-inline:20px;padding-block:0 56px}
.wrap{max-width:1180px;margin:0 auto}
a{color:var(--accent-strong)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}

/* en-tête */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:22px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--title)}
.logo svg{flex:none}
.logo b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;color:var(--accent)}
.logo small{display:block;font-family:var(--hand);font-size:13px;letter-spacing:.04em;color:var(--ink-soft)}
.search{flex:1 1 220px;max-width:340px}
.search input{width:100%;font:inherit;font-size:15px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.search input::placeholder{color:var(--ink-soft)}

/* accueil */
.intro{padding-block:34px 26px;max-width:46em}
.intro h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.6vw,44px);line-height:1.12;color:var(--accent);margin:0 0 10px;text-wrap:balance}
.intro p{margin:0;font-style:italic;font-weight:600;color:var(--ink-soft)}
.home{display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:820px){.home{grid-template-columns:minmax(0,1fr);gap:24px}}
.filters{display:flex;flex-direction:column;gap:20px}
@media (max-width:820px){.filters{flex-direction:row;flex-wrap:wrap;gap:16px 32px}}
.filters fieldset{border:0;margin:0;padding:0;min-width:0}
.filters legend{font-family:var(--display);font-size:18px;color:var(--accent);text-decoration:underline;text-underline-offset:4px;padding:0;margin-bottom:8px}
.filters label{display:flex;align-items:center;gap:8px;font-size:15.5px;line-height:1.35;padding-block:2px;cursor:pointer}
.filters input{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}
.filters .n{color:var(--ink-soft);font-size:13px}
.reset{align-self:flex-start;font:inherit;font-size:14px;background:none;border:0;padding:0;color:var(--accent-strong);text-decoration:underline;cursor:pointer}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:44px 36px}
.card{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;min-width:0}
.card .pic{width:100%}
.card h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2;color:var(--title);margin:0;text-wrap:balance}
.btn{display:inline-block;font-family:var(--body);font-weight:700;font-size:15px;text-decoration:none;background:var(--accent);color:var(--on-accent);padding:9px 30px;border-radius:999px;border:0;cursor:pointer}
.btn:hover{background:var(--accent-strong)}
.empty{grid-column:1 / -1;color:var(--ink-soft);font-style:italic;margin:0}
.count{font-size:14px;color:var(--ink-soft);margin:0 0 18px}

/* photo ou emplacement */
.pic{aspect-ratio:5/4;max-width:100%;border-radius:22px;overflow:hidden;background:linear-gradient(145deg,var(--ph-a),var(--ph-b));display:grid;place-items:center;color:var(--ph-ink)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .ph{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--hand);font-size:15px;letter-spacing:.05em;text-transform:uppercase}

/* la Terre et la recette du jour */
.terre{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:center;margin-bottom:44px;padding:24px 28px;background:var(--panel);border-radius:22px}
@media (max-width:820px){.terre{grid-template-columns:minmax(0,1fr);gap:20px;padding:18px}}
.terre.sans-globe{grid-template-columns:minmax(0,1fr)}
.globe{width:100%;max-width:480px;justify-self:center}
.globe canvas{display:block;width:100%;aspect-ratio:1/1;touch-action:pan-y;cursor:grab;border-radius:20px}
.globe p{margin:4px 0 0;text-align:center;font-size:13.5px;color:var(--ink-soft)}
.jour{display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-family:var(--hand);font-size:17px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-strong);margin:0}
.jour-r{display:grid;grid-template-columns:140px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:460px){.jour-r{grid-template-columns:96px minmax(0,1fr);gap:14px}}
.jour-r .pic{aspect-ratio:1/1;border-radius:16px}
.jour-r .ph span{display:none}
.jour-t{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.jour-t h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,3vw,30px);line-height:1.15;color:var(--accent);margin:0;text-wrap:balance}
.ou{margin:0;font-weight:600;font-size:15px}
.jour-jeu{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-top:16px;border-top:1px solid var(--line)}
.jour-jeu p{margin:0;font-size:15px;flex:1 1 200px}
.btn:disabled{opacity:.6;cursor:default}
.origines{list-style:none;margin:0;padding:0;font-size:14.5px;display:flex;flex-direction:column;gap:3px}
.origines b{font-weight:700}

/* fiche */
.back{display:inline-block;margin-block:22px 18px;font-weight:600;font-size:15px;text-decoration:none}
.back:hover{text-decoration:underline}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr);gap:24px}}
.hero .pic{aspect-ratio:1/1;width:100%}
.hero-text{text-align:center;display:flex;flex-direction:column;gap:22px;align-items:center;min-width:0}
.hero-text h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,5.4vw,60px);line-height:1.08;color:var(--accent);margin:0;text-wrap:balance}
.hero-text .lead{font-style:italic;font-weight:600;font-size:18px;color:var(--ink);margin:0;max-width:30em}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 40px;list-style:none;margin:0;padding:0}
.facts li{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--hand);font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft)}
.facts .fl{display:flex;flex-direction:column;align-items:center;line-height:1.35;text-align:center}
.facts .dot{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;list-style:none;margin:0;padding:0}
.tags li{font-size:13.5px;font-weight:600;padding:3px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink-soft)}

.body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:start;margin-top:48px}
@media (max-width:820px){.body{grid-template-columns:minmax(0,1fr);gap:28px;margin-top:32px}}
.ingr{background:var(--panel);border-radius:22px;padding:26px 30px}
.ingr h2{font-family:var(--display);font-weight:400;font-size:24px;color:var(--accent);text-decoration:underline;text-underline-offset:5px;margin:0 0 14px}
.ingr ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.pers{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.pers-l{font-size:15px;font-weight:600}
.stepper{display:inline-flex;align-items:center;gap:10px}
.pm{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font:700 20px/1 var(--body);cursor:pointer;display:grid;place-items:center;padding:0}
.pm:hover{background:var(--accent-strong)}
.pm:disabled{opacity:.35;cursor:default}
.nb{min-width:7.2em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.prep{min-width:0}
.prep h2{font-family:var(--display);font-weight:400;font-size:32px;color:var(--accent);margin:0 0 14px}
.prep ol{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:12px;max-width:38em}
.prep ol li::marker{font-weight:700;color:var(--accent-strong)}
.todo{margin:0;max-width:38em;font-style:italic;color:var(--ink-soft)}
.secret{margin-top:28px;max-width:38em;border-left:4px solid var(--accent);padding:4px 0 4px 18px}
.secret h3{font-family:var(--hand);font-weight:400;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-strong);margin:0 0 4px}
.secret p{margin:0}
.source{margin-top:24px;font-size:14px;color:var(--ink-soft)}
footer{margin-top:64px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-soft);text-align:center}
</style>

<div class="wrap">
  <header class="top">
    <a class="logo" href="#accueil" aria-label="Recettes de famille, retour à l'accueil">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="22" fill="var(--accent)"/><path d="M12 22h22a11 11 0 0 1-22 0z" fill="var(--on-accent)"/><path d="M10 20h26" stroke="var(--on-accent)" stroke-width="2.4" stroke-linecap="round"/><path d="M18 15c-1.6-1.6 1.6-3 0-4.8M23 15c-1.6-1.6 1.6-3 0-4.8M28 15c-1.6-1.6 1.6-3 0-4.8" fill="none" stroke="var(--on-accent)" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span><b>Recettes de famille</b><small>pour mes filles</small></span>
    </a>
    <div class="search" id="search-box"><input id="q" type="search" placeholder="Chercher une recette, un ingrédient…" aria-label="Chercher une recette"></div>
  </header>
  <main id="app"></main>
  <footer>Les recettes de la maison, à transmettre.</footer>
</div>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson.min.js"></script>
<script src="data/pays.js"></script>
<script src="data/terre.js"></script>
<script>
/* ---------- Les recettes : pour en ajouter une, copier un bloc et le remplir ---------- */
const RECETTES = [
  {
    id: "boeuf-bourguignon",
    origine: { pays: "France", lieu: "Bourgogne", lat: 47.3, lon: 5.0, iso: "250" }, // où flécher le plat sur la Terre
    titre: "Bœuf bourguignon",
    intro: "Le plat qui embaume la maison. Il se prépare la veille : plus il mijote doucement, meilleur il est.",
    photo: "photos/boeuf-bourguignon.jpg", // photo Marmiton, à remplacer par la nôtre
    cadrage: "78% center", // partie de la photo à garder visible quand elle est recadrée
    personnes: 4,
    temps: "1 h de préparation, 4 h de cuisson",
    difficulte: "Facile",
    type: "Plats",
    vientDe: "Maman",
    occasion: ["Repas de famille", "Hiver"],
    cuisson: ["Cocotte"],
    ingredients: [
      // [quantité, texte au singulier, texte au pluriel] : la quantité suit le nombre de personnes. Un texte seul ne change pas.
      { liste: [[600, "g de bœuf à bourguignon"], [4, "oignon", "oignons"], [4, "carotte", "carottes"], [1, "bouteille de vin rouge, assez bon", "bouteilles de vin rouge, assez bon"], [100, "g de beurre"], "1 bouquet garni", "Sel, poivre"] }
    ],
    etapes: [
      "Coupe la viande en cubes d'environ 3 cm et retire les gros morceaux de gras.",
      "Émince les oignons et fais-les fondre au beurre dans une poêle. Quand ils sont transparents, verse-les dans une cocotte, en fonte si possible.",
      "Dans la même poêle, fais dorer la viande à feu vif, en plusieurs fois, en remettant un peu de beurre entre chaque fournée. Ajoute-la au fur et à mesure dans la cocotte.",
      "Déglace la poêle avec un peu d'eau ou de vin : porte à ébullition en grattant le fond pour décoller les sucs. Sale, poivre et verse dans la cocotte.",
      "Mouille avec une partie du vin, ajoute le bouquet garni et les carottes coupées en rondelles. Laisse mijoter quelques heures à feu très doux.",

    ],
    secret: "Bien saisir la viande à feu fort, jusqu'à ce qu'elle soit très dorée, presque noire. Et ne pas presser la cuisson : avec des temps de repos entre deux mijotages, le plat est encore meilleur. Au bout de trois jours, c'est un régal.",
    source: { nom: "Marmiton", url: "https://www.marmiton.org/recettes/recette_boeuf-bourguignon_18889.aspx" }
  },
  {
    id: "hachis-parmentier",
    origine: { pays: "France", lieu: "Picardie", lat: 49.65, lon: 2.57, iso: "250" }, // où flécher le plat sur la Terre
    titre: "Hachis parmentier",
    intro: "Mimi adore mais Jadou déteste ;-)",
    photo: "photos/hachis-parmentier.jpg", // photo Cookomix, à remplacer par la nôtre
    personnes: 4,
    temps: "25 min de préparation, 55 min de cuisson",
    difficulte: "Facile",
    type: "Plats",
    vientDe: "Maman",
    occasion: ["Tous les jours"],
    cuisson: ["Thermomix", "Four"],
    ingredients: [
      { titre: "Pour la viande :", liste: [[1, "oignon jaune", "oignons jaunes"], [1, "gousse d'ail", "gousses d'ail"], [30, "g de beurre demi-sel"], [400, "g de bœuf haché"], [20, "g de persil frais"], [1, "cuillère à café d'herbes de Provence", "cuillères à café d'herbes de Provence"], [1, "cuillère à soupe de parmesan râpé", "cuillères à soupe de parmesan râpé"], "2 pincées de sel, 2 pincées de poivre"] },
      { titre: "Pour la purée :", liste: [[700, "g de pommes de terre"], [270, "g de lait demi-écrémé"], [40, "g de beurre demi-sel"], [100, "g d'emmental râpé"], "2 pincées de sel, 2 pincées de poivre", "1 pincée de muscade"] }
    ],
    etapes: [
      "Mets l'oignon et l'ail épluchés dans le bol et mixe 4 secondes à vitesse 5. Racle les parois avec la spatule.",
      "Ajoute les 30 g de beurre et fais revenir 4 minutes à 120 °C, vitesse 1.",
      "Ajoute le bœuf haché, le persil, les herbes de Provence, le sel et le poivre. Cuis 5 minutes à 100 °C, vitesse 1.",
      "Ajoute le parmesan, mélange à la spatule, puis cuis encore 1 minute à 100 °C.",
      "Verse la viande dans un plat à gratin beurré. Préchauffe le four à 220 °C.",
      "Installe le fouet dans le bol. Mets les pommes de terre coupées en lamelles, le lait, le sel, le poivre et la muscade. Cuis 28 minutes à 95 °C, vitesse 1.",
      "Ajoute les 40 g de beurre et mélange 40 secondes à vitesse 3 pour obtenir la purée.",
      "Recouvre la viande de purée, parsème d'emmental râpé et enfourne 15 minutes à 220 °C, jusqu'à ce que le dessus soit bien doré."
    ],
    source: { nom: "Cookomix", url: "https://www.cookomix.com/recettes/hachis-parmentier-thermomix/" }
  },
  {
    id: "croque-monsieur",
    origine: { pays: "France", lieu: "Paris", lat: 48.86, lon: 2.35, iso: "250" }, // où flécher le plat sur la Terre
    titre: "Croque-monsieur",
    intro: "Le vrai, avec de la béchamel dedans et dessus, gratiné sous le gril. Prêt en vingt minutes pour un soir de semaine.",
    photo: "photos/croque-monsieur.jpg", // photo 750g, à remplacer par la nôtre
    personnes: 4,
    temps: "10 min de préparation, 12 min de cuisson",
    difficulte: "Facile",
    type: "Plats",
    vientDe: "Maman",
    occasion: ["Tous les jours"],
    cuisson: ["Four"],
    ingredients: [
      { liste: [[8, "tranches de pain de mie complet"], [200, "g de jambon blanc"], [100, "g de comté fraîchement râpé (ou cantal, ou gruyère)"]] },
      { titre: "Pour la béchamel :", liste: [[30, "g de beurre"], [30, "g de farine"], [30, "cl de lait demi-écrémé"], "Sel", "Noix de muscade"] }

    etapes: [
      "Allume le gril du four.",
      "Prépare la béchamel : fais fondre le beurre à feu doux, ajoute la farine et mélange au fouet. Verse le lait petit à petit sans cesser de remuer, puis laisse épaissir quelques minutes. Sale et râpe un peu de muscade.",

      "Tartine les autres tranches de béchamel et referme les croques, côté béchamel à l'intérieur. Appuie légèrement pour les souder.",
      "Étale le reste de béchamel sur le dessus et parsème du fromage restant.",
      "Passe les croques sous le gril une douzaine de minutes, jusqu'à ce qu'ils soient bien dorés. Surveille-les : sous le gril, ça va vite."

    secret: "Pour plus de croustillant, beurre légèrement l'extérieur du pain avec du beurre mou plutôt que fondu. Et mets toujours une fine couche de béchamel sous le fromage du dessus : elle l'empêche de durcir.",

  {
    id: "veloute-butternut",
    origine: { pays: "États-Unis", lieu: "Massachusetts", lat: 42.4, lon: -71.4, iso: "840" }, // où flécher le plat sur la Terre

    intro: "La soupe préférée de Jadou quand elle était petite.",

    temps: "12 min de préparation, 26 min de cuisson",

    vientDe: "Maman",
    occasion: ["Tous les jours", "Automne"],
    cuisson: ["Thermomix"],
    ingredients: [
      { liste: [[600, "g de butternut"], [1, "oignon jaune", "oignons jaunes"], [1, "gousse d'ail", "gousses d'ail"], [20, "g de beurre"], [500, "g d'eau"], [1, "cube de bouillon de volaille", "cubes de bouillon de volaille"], [1, "cuillère à soupe de Boursin", "cuillères à soupe de Boursin"], "½ cuillère à café de sel", "1 pincée de poivre"] }
    ],
    etapes: [
      "Mets l'oignon et l'ail épluchés dans le bol et mixe 5 secondes à vitesse 5. Racle les parois avec la spatule.",

      "Ajoute la butternut épluchée et coupée en morceaux, l'eau, le cube de bouillon, le sel et le poivre. Cuis 20 minutes en température Varoma.",

      "Sers tout de suite, bien chaud."
    ],
    secret: "Au moment de servir, tu peux ajouter un trait de crème liquide, quelques gouttes d'huile de noisette, ou un peu de coriandre ou de menthe fraîche.",

  {

    intro: "Le tiramisu de Jadou, avec des Belvita à la place des biscuits à la cuillère.",
