<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recettes</title>
<!-- application sur téléphone : « Ajouter à l'écran d'accueil » -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo/icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="logo/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recettes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1A1C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap">
<style>
/* Layout : filtres à gauche + grille de cartes ; fiche = photo | titre, puis ingrédients | préparation */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --line:#DDDDDD;
  --ink:#333333; --ink-soft:#6B6B6B; --title:#333333;
  --accent:#CC0066; --accent-strong:#A30052; --on-accent:#FFFFFF; --olive:#7F8C1E;
  --ph-a:#FBD9E8; --ph-b:#F3A9CB; --ph-ink:#A30052;
  --sea:#DCE8EC; --land:#CBBDA7; --land-hi:#EFA565; --map-line:#978A79;
  --display:"Gochi Hand","Marker Felt","Comic Sans MS",cursive;
  --body:"Trebuchet MS",Trebuchet,"Helvetica Neue",Arial,sans-serif;
  --hand:"Gochi Hand","Marker Felt","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1A1C; --panel:#1D1A1C; --line:#3E383B;
    --ink:#E6DFD7; --ink-soft:#B3AAA0; --title:#F1EAE2;
    --accent:#F0559E; --accent-strong:#F77FB6; --on-accent:#2A0A18; --olive:#B7C24A;
    --ph-a:#4A2236; --ph-b:#6B2A4B; --ph-ink:#F7B6D4;
    --sea:#1F2D35; --land:#5C5044; --land-hi:#C56A22; --map-line:#8F8171;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1A1C; --panel:#1D1A1C; --line:#3E383B;
  --ink:#E6DFD7; --ink-soft:#B3AAA0; --title:#F1EAE2;
  --accent:#F0559E; --accent-strong:#F77FB6; --on-accent:#2A0A18; --olive:#B7C24A;
  --ph-a:#4A2236; --ph-b:#6B2A4B; --ph-ink:#F7B6D4;
    --sea:#1F2D35; --land:#5C5044; --land-hi:#C56A22; --map-line:#8F8171;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0;padding-inline:20px;padding-block:0 56px}
.wrap{max-width:1180px;margin:0 auto}
a{color:var(--accent-strong)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}

/* en-tête */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:22px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:clamp(12px,3vw,32px);text-decoration:none;color:var(--title);flex:1 1 520px;min-width:0}
.logo img{flex:none;width:clamp(110px,22vw,230px);height:auto}
.logo b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,78px);line-height:1.05;color:var(--accent);text-wrap:balance}
.logo small{display:block;margin-top:6px;font-family:var(--hand);font-size:clamp(15px,2vw,22px);color:var(--olive)}
.top{align-items:flex-end}
.search{flex:1 1 220px;max-width:340px}
.search input{width:100%;font:inherit;font-size:15px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.search input::placeholder{color:var(--ink-soft)}

/* accueil */
.intro{padding-block:34px 26px;max-width:46em}
.intro h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.6vw,44px);line-height:1.12;color:var(--accent);margin:0 0 10px;text-wrap:balance}
.intro p{margin:0;font-style:italic;font-weight:600;color:var(--ink-soft)}
.home{display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:820px){.home{grid-template-columns:minmax(0,1fr);gap:24px}}
.filters{display:flex;flex-direction:column;gap:20px}
.filters fieldset{border:0;margin:0;padding:0;min-width:0}
.filters legend{font-family:var(--display);font-size:22px;color:var(--accent);padding:0;margin-bottom:8px}
.filters label{display:flex;align-items:center;gap:8px;font-size:15.5px;line-height:1.35;padding-block:2px;cursor:pointer}
.filters input{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}
.filters .n{color:var(--ink-soft);font-size:13px}
.reset{align-self:flex-start;font:inherit;font-size:14px;background:none;border:0;padding:0;color:var(--accent-strong);text-decoration:underline;cursor:pointer}
.filtrer{display:none}
.filters-tete,.voile{display:none}
@media (max-width:820px){
  .filtrer{display:inline-flex;align-items:center;gap:8px;justify-self:start;font:inherit;font-weight:700;font-size:15px;padding:9px 18px;border-radius:999px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent-strong);cursor:pointer}
  .filtrer[aria-expanded="true"]{background:var(--accent);color:var(--on-accent)}
  /* sur téléphone : panneau qui monte du bas, par-dessus la page */
  .filters{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:82vh;max-height:82dvh;overflow-y:auto;overscroll-behavior:contain;gap:16px;background:var(--panel);border-radius:22px 22px 0 0;padding:0 18px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
  .filters.ouvert{display:flex;animation:monte .22s ease-out}
  @keyframes monte{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
  .voile{display:block;position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.4)}
  .voile[hidden]{display:none}
  html.panneau-ouvert{overflow:hidden}
  .filters-tete{display:flex;position:sticky;top:0;z-index:1;align-items:center;justify-content:space-between;background:var(--panel);padding:16px 0 10px;border-bottom:1px solid var(--line)}
  .filters-tete b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--accent)}
  .fermer{width:40px;height:40px;border-radius:50%;border:0;background:var(--line);color:var(--ink);font:700 22px/1 var(--body);cursor:pointer;display:grid;place-items:center}
  .filters-pied{position:sticky;bottom:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);padding:12px 0 calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .filters-pied .reset{align-self:center}
  .voir{flex:1;max-width:260px;padding:12px 20px;font-size:16px}
  .filters legend{font-size:15px;text-decoration:none;margin-bottom:6px}
  .filters .opts{display:flex;flex-wrap:wrap;gap:8px}
  .filters label{position:relative;gap:5px;font-size:14px;padding:5px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg)}
  .filters label input{position:absolute;opacity:0;width:1px;height:1px}
  .filters label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .filters label:has(input:checked) .n{color:inherit}
  .filters label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:30px 22px}
.card{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0}
.card .pic{border-radius:14px}
.card .btn{font-size:13.5px;padding:6px 18px}
@media (max-width:460px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}}
.card .pic{width:100%}
.pic-lien{display:block;width:100%;border-radius:14px;transition:transform .15s}
.pic-lien:hover{transform:scale(1.02)}
.pic-lien:active{transform:scale(.98)}
.card h2{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2;color:var(--title);margin:0;text-wrap:balance}
.btn{display:inline-block;font-family:var(--body);font-weight:700;font-size:15px;text-decoration:none;background:var(--accent);color:var(--on-accent);padding:9px 30px;border-radius:999px;border:0;cursor:pointer}
.btn:hover{background:var(--accent-strong)}
.empty{grid-column:1 / -1;color:var(--ink-soft);font-style:italic;margin:0}
.count{font-size:14px;color:var(--ink-soft);margin:0 0 18px}

/* photo ou emplacement */
.pic{aspect-ratio:5/4;max-width:100%;border-radius:22px;overflow:hidden;background:linear-gradient(145deg,var(--ph-a),var(--ph-b));display:grid;place-items:center;color:var(--ph-ink)}
.pic{position:relative}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pic .ph{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--hand);font-size:15px;letter-spacing:.05em;text-transform:uppercase}

/* la Terre et la recette du jour */
.terre{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:center;margin-bottom:44px;padding:24px 28px;background:var(--panel);border:1px solid var(--line);border-radius:5px}
@media (max-width:820px){.terre{grid-template-columns:minmax(0,1fr);gap:20px;padding:18px}}
.terre.sans-globe{grid-template-columns:minmax(0,1fr)}
.globe{width:100%;max-width:480px;justify-self:center}
.globe canvas{display:block;width:100%;aspect-ratio:1/1;touch-action:pan-y;cursor:grab;border-radius:20px}
.zoom{display:block;margin:10px auto 0;font:inherit;font-weight:700;font-size:14px;padding:7px 18px;border-radius:999px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent-strong);cursor:pointer}
.zoom[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.globe p{margin:4px 0 0;text-align:center;font-size:13.5px;color:var(--ink-soft)}
.jour{display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-family:var(--hand);font-size:18px;color:var(--olive);margin:0}
.jour-r{display:grid;grid-template-columns:140px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:460px){.jour-r{grid-template-columns:96px minmax(0,1fr);gap:14px}}
.jour-r .pic{aspect-ratio:1/1;border-radius:16px}
.jour-r .ph span{display:none}
.jour-t{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.jour-t h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,3vw,30px);line-height:1.15;color:var(--accent);margin:0;text-wrap:balance}
.jour-jeu{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-top:16px;border-top:1px solid var(--line)}
.jour-jeu p{margin:0;font-size:15px;flex:1 1 auto}
@media (max-width:820px){.jour-jeu{order:-1;padding-top:0;border-top:0;padding-bottom:16px;border-bottom:1px solid var(--line)}}
.btn:disabled{opacity:.6;cursor:default}

/* fiche */
.back{display:inline-block;margin-block:22px 18px;font-weight:600;font-size:15px;text-decoration:none}
.back:hover{text-decoration:underline}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr);gap:24px}}
.hero .pic{aspect-ratio:1/1;width:100%}
.hero-text{text-align:center;display:flex;flex-direction:column;gap:22px;align-items:center;min-width:0}
.hero-text h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,5.4vw,60px);line-height:1.08;color:var(--accent);margin:0;text-wrap:balance}
.hero-text .lead{font-style:italic;font-weight:600;font-size:18px;color:var(--ink);margin:0;max-width:30em}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 40px;list-style:none;margin:0;padding:0}
.facts li{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--hand);font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft)}
.facts .fl{display:flex;flex-direction:column;align-items:center;line-height:1.35;text-align:center}
.facts .dot{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;list-style:none;margin:0;padding:0}
.tags li{font-size:13.5px;font-weight:600;padding:3px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink-soft)}

.body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:start;margin-top:48px}
@media (max-width:820px){.body{grid-template-columns:minmax(0,1fr);gap:28px;margin-top:32px}}
.ingr{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:26px 30px}
.ingr h2{font-family:var(--display);font-weight:400;font-size:24px;color:var(--accent);text-decoration:underline;text-underline-offset:5px;margin:0 0 14px}
.ingr ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.pers{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.pers-l{font-size:15px;font-weight:600}
.stepper{display:inline-flex;align-items:center;gap:10px}
.pm{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font:700 20px/1 var(--body);cursor:pointer;display:grid;place-items:center;padding:0}
.pm:hover{background:var(--accent-strong)}
.pm:disabled{opacity:.35;cursor:default}
.nb{min-width:7.2em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.prep{min-width:0}
.prep h2{font-family:var(--display);font-weight:400;font-size:32px;color:var(--accent);margin:0 0 14px}
.prep ol{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:12px;max-width:38em}
.prep ol li::marker{font-weight:700;color:var(--accent-strong)}
.todo{margin:0;max-width:38em;font-style:italic;color:var(--ink-soft)}
.secret{margin-top:28px;max-width:38em;border-left:4px solid var(--accent);padding:4px 0 4px 18px}
.secret h3{font-family:var(--hand);font-weight:400;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-strong);margin:0 0 4px}
.secret p{margin:0}
.source{margin-top:24px;font-size:14px;color:var(--ink-soft)}
.video{margin-top:28px;max-width:38em}
.video h3{font-family:var(--hand);font-weight:400;font-size:22px;color:var(--accent-strong);margin:0 0 8px}
.video-lien{position:relative;display:block;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#000}
.video-lien img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.video-lien .play{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.35);transition:transform .15s}
.video-lien:hover .play{transform:scale(1.08);background:var(--accent-strong)}
.video .source{margin-top:8px}
footer{margin-top:64px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-soft);text-align:center}
/* petits dessins kawaii en transparence, derrière le titre et la préparation, comme dans le carnet */
.hero-text,.prep{position:relative}
.hero-text > :not(.deco),.prep > :not(.deco){position:relative;z-index:1}
.deco{position:absolute;inset:0;z-index:0;pointer-events:none}
.deco svg{position:absolute;width:var(--s);height:var(--s);transform:rotate(var(--r));opacity:.22;transition:opacity .2s}
.deco svg.libre{opacity:.75} /* aucun texte dessous : plus visible */
.hero-text .deco svg.libre{opacity:.55} /* autour du titre : visibles mais un peu pâles */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .deco svg{opacity:.16}:root:not([data-theme="light"]) .deco svg.libre{opacity:.6}}
:root[data-theme="dark"] .deco svg{opacity:.16}
:root[data-theme="dark"] .deco svg.libre{opacity:.6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero-text .deco svg.libre{opacity:.42}}
:root[data-theme="dark"] .hero-text .deco svg.libre{opacity:.42}
/* autour du titre : dans l'espace libre au-dessus du titre et sous les étiquettes */
.deco .t1{top:-86px;left:6%}
.deco .t2{top:-72px;right:4%}
.deco .t3{bottom:-86px;left:4%}
.deco .t4{bottom:-78px;right:8%}
@media (max-width:820px){
  .deco svg{width:calc(var(--s) * .75);height:calc(var(--s) * .75)}
  .deco .t1{top:-4px;left:0}
  .deco .t2{top:-4px;right:0}
  .deco .t3{bottom:-8px;left:0}
  .deco .t4{bottom:-8px;right:0}
}
@media print{.deco{display:none}}

/* barre au-dessus de la fiche : retour + écran allumé */
.fiche-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:36px}
.fiche-bar .eveil{margin-block:4px 12px}
.eveil{display:inline-flex;white-space:nowrap;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:14px;padding:7px 16px;border-radius:999px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent-strong);cursor:pointer}
.eveil[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* téléphone et application installée */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:calc(56px + env(safe-area-inset-bottom))}
a,button,input,label{-webkit-tap-highlight-color:transparent}
@media (max-width:600px){
  .top{gap:12px;padding-block:14px}
  .logo{flex-basis:100%;gap:12px}
  .logo img{width:84px}
  .logo b{font-size:34px}
  .logo small{font-size:16px;margin-top:2px}
  .search{flex-basis:100%;max-width:none}
  .search input{font-size:16px} /* 16 px : l'iPhone ne zoome pas quand on tape */
  .intro{padding-block:20px 16px}
  .back{margin-block:14px}
  .ingr{padding:20px}
  .ingr ul,.prep ol{font-size:17px}
  .prep ol{gap:16px}
  footer{margin-top:40px}
}
@media (display-mode: standalone){
  body{padding-top:env(safe-area-inset-top)}
  /* dans l'application, la barre retour reste en haut pendant qu'on cuisine */
  .fiche-bar{position:sticky;top:env(safe-area-inset-top);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
  .fiche-bar .back{margin-block:10px}
}
@media (display-mode: standalone) and (max-width:600px){
  /* en-tête réduit : petit logo, titre sur une ligne */
  .logo img{width:52px}
  .logo b{font-size:28px}
  .logo small{display:none}
}
</style>

<div class="wrap">
  <header class="top">
    <a class="logo" href="#accueil" aria-label="Recettes de famille, retour à l'accueil">
      <img src="logo/logo-site.svg" alt="" width="230" height="216">
      <span><b>Recettes de famille</b><small>pour mes filles</small></span>
    </a>
    <div class="search" id="search-box"><input id="q" type="search" placeholder="Chercher une recette, un ingrédient…" aria-label="Chercher une recette"></div>
  </header>
  <main id="app"></main>
  <footer>Les recettes de la maison, à transmettre.</footer>
</div>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson.min.js"></script>
<script src="data/pays.js"></script>
<script src="data/terre.js"></script>
<script src="data/france.js"></script>
<script>
/* ---------- Les recettes : pour en ajouter une, copier un bloc et le remplir ---------- */
const RECETTES = [
  {
    id: "boeuf-bourguignon",
    origine: { pays: "France", lieu: "Bourgogne", lat: 47.3, lon: 5.0, iso: "250" }, // où flécher le plat sur la Terre
    titre: "Bœuf bourguignon",
    deco: ["cocotte", "carotte", "vin", "oignon", "viande", "cuillere"], // petits dessins en fond de fiche
    intro: "Le plat qui embaume la maison. Il se prépare la veille : plus il mijote doucement, meilleur il est.",
    photo: "photos/boeuf-bourguignon.jpg", // photo générée sur fal.ai (FLUX Pro Ultra, style sombre) le 13/11/2026
    personnes: 4,
    temps: "1 h de préparation, 4 h de cuisson",
    difficulte: "Facile",
    type: "Plats",
